<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Házőrző</title>

    <!-- FONTOS: A manifest hivatkozás, hogy a Chrome megtalálja az ikont és a nevet -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ikon iOS eszközökhöz (opcionális, de ajánlott) -->
    <link rel="apple-touch-icon" href="assets/icon.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #222;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>

    <!-- Mobilos konzol (Eruda) a hibakereséshez -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Játék logika -->
    <script src="script.js"></script>
</body>
</html>
