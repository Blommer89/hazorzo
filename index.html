<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Bit Berni Udvar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Itt fog rajzolódni az udvar és a kutya -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Interaktív gombok a képernyő alján -->
    <div id="ui-controls">
        <button id="btn-whistle">📯 Síp</button>
        <button id="btn-food">🍖 Kaja</button>
        <button id="btn-water">💧 Víz</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
